[project]
name = "deep-research-platform"
version = "0.1.0"
description = "Deep Research 自主研究 Agent 平台：规划-检索-阅读-反思-综合的自主研究闭环"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "ddgs>=9.16.0",
    "crawl4ai>=0.9.3",
    "trafilatura>=2.2.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "instructor>=1.17",
    "openai>=2.0,<3.0",
    "arq>=0.26",
    "playwright>=1.62.0",
    "markdown>=3.10.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
